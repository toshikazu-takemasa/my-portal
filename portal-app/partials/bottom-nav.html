  設定はヘッダー廃止に伴いここへ移した（歯車アイコン + ラベル）。
  「今日」（デイリーチェックリスト）は 2026-08-19 に機能ごと削除。
-->

      <span class="bottom-nav-dot"></span>
      <span class="bottom-nav-label">対話</span>
    </button>
    <button class="bottom-nav-item" data-section="diary" onclick="switchBottomNav('diary')">
      <span class="bottom-nav-dot"></span>
      <span class="bottom-nav-label">日記</span>
    </button>
    <button class="bottom-nav-item" data-section="memo" onclick="switchBottomNav('memo')">
      <span class="bottom-nav-dot"></span>
      <span class="bottom-nav-label">メモ</span>
    </button>
    <button class="bottom-nav-item" data-section="settings" onclick="switchBottomNav('settings')">

      <span class="bottom-nav-label">設定</span>
    </button>
  </div>
</nav>
